[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flammap"
version = "0.1.0"
description = "Config-driven pipeline for generating flammability limits and phase diagrams."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ase",
  "cantera",
  "cupy-cuda12x",
  "dftd3",
  "gpu4pyscf-cuda12x>=1.5,<1.8",
  "hip[cuda121]",
  "huggingface_hub>=0.27",
  "matplotlib",
  "numpy",
  "pandas",
  "pymsym",
  "pyscf>=2.8,<2.14",
  "PyYAML",
  "scipy<1.15",
  "skala",
  "torch==2.5.1",
]

[project.scripts]
flammap = "flammability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Vendored hip config — see ml.py:_patch_hip_config_path for context.
"flammability" = ["_hip_data/**/*.yaml"]

# hip and skala are pinned to specific commits so `uv sync` alone is enough to
# bootstrap FlamMap — no sibling clones required. Bump `rev` to a newer SHA to
# pick up changes. For local development against a live checkout, override
# per-user in `uv.toml` or temporarily swap these entries to
# `{ path = "../hip", editable = true }` / `{ path = "../skala", editable = true }`.
#
# hip points at a fork (Jiaqi-ZHOU/hip) of upstream BurgerAndreas/hip @ 06fedad
# (HIP v3) carrying one extra commit: a relative rot_thresh for robust
# linear-molecule detection (3N-5 vs 3N-6 DOF), which FlamMap needs for linear
# CHON fuels. To track newer upstream hip, rebase that commit onto the new
# upstream SHA in the fork and bump `rev` here.
[tool.uv.sources]
hip = { git = "https://github.com/Jiaqi-ZHOU/hip", rev = "7ad2925af90fb7eff1cbd07f94c32d094652686f" }
skala = { git = "https://github.com/microsoft/skala", rev = "7916d9fc108cb76daf20f893f82c3cd2c8fa0b1e" }
torch = [{ index = "pytorch-cu121" }]
torch-geometric = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
# pyg-lib / torch-scatter / torch-sparse / torch-cluster CUDA wheels
# (versioned like 0.4.0+pt25cu121) live on the PyG wheel index.
find-links = [
  "https://data.pyg.org/whl/torch-2.5.1+cu121.html",
]

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch", "setuptools", "wheel"]
torch-scatter = ["torch", "setuptools", "wheel"]
torch-sparse = ["torch", "setuptools", "wheel"]
pyg-lib = ["torch", "setuptools", "wheel"]
