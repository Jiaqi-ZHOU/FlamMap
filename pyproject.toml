[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flammap"
version = "0.1.0"
description = "Config-driven pipeline for generating flammability limits and phase diagrams."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ase",
  "cantera",
  "dftd3",
  "hip",
  "matplotlib",
  "numpy",
  "pandas",
  "pymsym",
  "pyscf",
  "PyYAML",
  "scipy<1.15",
  "skala",
  "torch",
]

[project.scripts]
flammap = "flammability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
hip = { git = "https://github.com/BurgerAndreas/hip" }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
